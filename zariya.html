<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aadarsh ❤️ Alina</title>

  <!-- Fonts & Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/@sakun/system.css" />

  <style>
    /* BODY & GENERAL STYLES */
    body {
      margin: 0;
      font-family: 'Great Vibes', cursive;
      background: #31003c;
      color: #fff;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      position: relative;
    }

    /* Heart Glow */
    .heart-glow {
      font-size: 60px;
      color: #ff69b4;
      animation: pulse 2s infinite;
      margin-bottom: 20px;
      z-index: 5;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.2); opacity: 0.7; }
    }

    /* MESSAGE BOX */
    .message-box {
      text-align: center;
      max-width: 600px;
      padding: 30px;
      background: rgba(255, 182, 193, 0.1);
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(255,182,193,0.4);
      z-index: 10;
    }

    h1 {
      font-size: 36px;
      color: #ffe6f2;
      margin-bottom: 20px;
      text-shadow: 2px 2px 5px #ff99cc;
    }

    h2 {
      font-size: 24px;
      color: #fff0f5;
      margin-bottom: 25px;
      min-height: 50px;
    }

    p {
      font-size: 22px;
      margin-bottom: 30px;
    }

    .button, button, .btn {
      background: linear-gradient(45deg, #ffb6c1, #ff69b4);
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 30px;
      cursor: pointer;
      color: #31003c;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 5px 15px rgba(255,182,193,0.4);
      margin: 5px;
    }

    .button:hover, button:hover, .btn:hover {
      transform: scale(1.2);
      background: linear-gradient(45deg, #ff69b4, #ffb6c1);
    }

    /* BALLOONS */
    .balloons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .balloon {
      width: 80px;
      height: 100px;
      background: pink;
      border-radius: 50%;
      position: relative;
      text-align: center;
      line-height: 100px;
      font-size: 20px;
      color: #31003c;
      box-shadow: 0 0 10px rgba(255,182,193,0.6);
    }

    .balloon::after {
      content: '';
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: white;
      transform: translateX(-50%);
    }

    /* ANIME & VALENTINE PICS */
    .anime-pics, .photos, #valentines-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .anime-pics img, .photos img, #valentines-container img {
      width: 130px;
      border-radius: 15px;
      box-shadow: 0 0 15px rgba(255,182,193,0.5);
      transition: transform 0.5s;
    }

    .anime-pics img:hover, .photos img:hover, #valentines-container img:hover {
      transform: scale(1.3);
    }

    /* FLOATING HEARTS */
    .heart-float {
      position: absolute;
      font-size: 20px;
      color: #ffb6c1;
      animation: float 5s linear infinite;
      user-select: none;
      z-index: 1;
    }

    @keyframes float {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 1;}
      100% { transform: translateY(-50vh) rotate(360deg); opacity: 0;}
    }

    @media screen and (max-width: 480px) {
      .container {
        padding: 20px;
        max-width: 90%;
      }
      .container img { padding: 0px; }
      .btn { font-size: 32px !important; }
    }

    audio { width: 100%; margin-top: 20px; outline: none; z-index: 10; }

  </style>
</head>
<body>

  <!-- HEART GLOW -->
  <div class="heart-glow">💗</div>

  <!-- FLOATING HEARTS -->
  <div id="hearts"></div>

  <!-- MAIN MESSAGE BOX -->
  <div class="message-box" id="stage">
    <h1>I have something special to tell you...</h1>
    <p>Something that will change everything ✨</p>
    <button class="button" onclick="nextStage()">💗 Tap to Begin</button>
  </div>

  <!-- MUSIC PLAYER -->
  <audio id="bgMusic" controls loop>
    <source src="your-song.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <!-- VALENTINE RANDOM IMAGE CONTAINER -->
  <div class="container">
    <button class="btn" id="refreshButton">Receive New Valentine <3</button>
    <div id="valentines-container"></div>
    <div>
      <p>&lt;3 lots o'love Claire &copy; 2025</p>
    </div>
  </div>

  <script>
    // FLOATING HEARTS GENERATOR
    const heartsContainer = document.getElementById("hearts");
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart-float";
      heart.textContent = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 20 + 15) + "px";
      heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
      heartsContainer.appendChild(heart);
      setTimeout(() => heart.remove(), 10000);
    }
    setInterval(createHeart, 400);

    // STAGE FUNCTIONS
    function nextStage() {
      document.getElementById('stage').innerHTML = `
        <h1>This is what I wanted to say for so long...</h1>
        <p>Watch the balloons carry my message to you</p>
        <div class="balloons">
          <div class="balloon">I</div>
          <div class="balloon">Love</div>
          <div class="balloon">You</div>
        </div>
        <p>There's more I want to show you...</p>
        <button class="button" onclick="finalStage()">Continue →</button>
      `;
    }

    function finalStage() {
      document.getElementById('stage').innerHTML = `
        <h1>From the first day I met you, life became brighter...</h1>
        <p>You've made every moment so special 💞</p>
        <div class="anime-pics">
          <img src="https://i.ibb.co/4tYdBv0/cute1.jpg" alt="Anime 1"/>
          <img src="https://i.ibb.co/mD0ZqGc/cute2.jpg" alt="Anime 2"/>
        </div>
        <h2 id="question">Do you have room in your heart for me?</h2>
        <div class="buttons">
          <button id="yes">Yes 💖</button>
          <button id="no">No 😢</button>
        </div>
        <p id="response"></p>
        <div id="photos" class="photos"></div>
      `;

      // QUIZ LOGIC
      const question = document.getElementById("question");
      const response = document.getElementById("response");
      const photos = document.getElementById("photos");
      const yesBtn = document.getElementById("yes");
      const noBtn = document.getElementById("no");

      let currentQuestion = 0;

      const questions = [
        "Will you be my Valentine, sweet Alina? 💌",
        "Do you enjoy laughing with me? 😊",
        "Do I make your heart flutter? 💕",
        "Would you like a surprise from me? 🎁",
        "Will you share a smile with me today? 🌟"
      ];

      const cutePhotos = [
        "https://i.ibb.co/4tYdBv0/cute1.jpg",
        "https://i.ibb.co/mD0ZqGc/cute2.jpg",
        "https://i.ibb.co/0J5F6nM/cute3.jpg"
      ];

      noBtn.addEventListener("click", () => {
        response.textContent = "I really want you to select YES 💖, pleaseeee!";
      });

      yesBtn.addEventListener("click", () => {
        response.textContent = "";
        if (currentQuestion < questions.length) {
          question.textContent = questions[currentQuestion];
          currentQuestion++;
        } else {
          question.textContent = "Here are some sweet memories for you ❤️";
          yesBtn.style.display = "none";
          noBtn.style.display = "none";

          cutePhotos.forEach(src => {
            const img = document.createElement("img");
            img.src = src;
            photos.appendChild(img);
          });
        }
      });
    }

    // VALENTINE RANDOM IMAGE SCRIPT
    const images = [
      "./img/lego-1.jpg",
      "./img/lego-2.jpg",
      "./img/lego-3.jpg",
      "./img/lego-4.png",
      "./img/lego-5.png"
    ];

    function showRandomValentine() {
      const randomImage = images[Math.floor(Math.random() * images.length)];
      document.getElementById("valentines-container").innerHTML = "<img src='" + randomImage + "'>";
    }

    showRandomValentine();

    document.getElementById("refreshButton").addEventListener("click", showRandomValentine);

  </script>

</body>
</html>
